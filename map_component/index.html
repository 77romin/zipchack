<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<iframe id="map-frame" style="width:100%;height:575px;border:0" title="집착 지도"></iframe>
<script>
const frame=document.getElementById('map-frame');let navigation=null,latest=null;
function send(type,extra={}){parent.postMessage({isStreamlitMessage:true,type,...extra},'*');}
window.addEventListener('message',event=>{
 if(event.source===parent && event.data.type==='streamlit:render'){
  const args=event.data.args;latest=args;
  if(navigation!==args.navigation){navigation=args.navigation;frame.srcdoc=args.html;}
  else frame.contentWindow.postMessage({type:'zipchack:data',regions:args.regions,explore:args.explore},'*');
  send('streamlit:setFrameHeight',{height:575});
 }
 if(event.source===frame.contentWindow && event.data.type==='zipchack:ready' && latest){
  frame.contentWindow.postMessage({type:'zipchack:data',regions:latest.regions,explore:latest.explore},'*');
 }
 if(event.source===frame.contentWindow && event.data.type==='zipchack:viewport'){
  send('streamlit:setComponentValue',{value:event.data.viewport,dataType:'json'});
 }
});
send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
