<svg xmlns="http://www.w3.org/2000/svg" width="920" height="780" viewBox="0 0 920 780"><title>집착 RAG UML 활동도</title><rect width="920" height="780" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#283c52"/></marker></defs><g font-family="Malgun Gothic,sans-serif" font-size="17" fill="#182532"><text x="40" y="35" font-size="24">집.착 RAG 활동도 · LangGraph 두 노드</text><circle cx="460" cy="65" r="10" fill="#182532"/><rect x="95" y="437" width="730" height="190" fill="#eff5fa" stroke="#4682a3"/><text x="110" y="430">partition LangGraph</text><line x1="460" y1="76" x2="460" y2="100" stroke="#283c52" marker-end="url(#a)"/><rect x="150" y="100" width="620" height="58" rx="17" fill="white" stroke="#283c52"/><text x="460" y="135" text-anchor="middle">질문 · 동네 · 모드 · Top-k</text><line x1="460" y1="164" x2="460" y2="188" stroke="#283c52" marker-end="url(#a)"/><rect x="150" y="188" width="620" height="58" rx="17" fill="white" stroke="#283c52"/><text x="460" y="223" text-anchor="middle">공식 메타데이터 · 위치/인구 문서 준비</text><line x1="460" y1="252" x2="460" y2="276" stroke="#283c52" marker-end="url(#a)"/><rect x="150" y="276" width="620" height="58" rx="17" fill="white" stroke="#283c52"/><text x="460" y="311" text-anchor="middle">P1 검색어 → 외부 검색 → P2 선별 · 질문 캐시</text><line x1="460" y1="340" x2="460" y2="364" stroke="#283c52" marker-end="url(#a)"/><rect x="150" y="364" width="620" height="58" rx="17" fill="white" stroke="#283c52"/><text x="460" y="399" text-anchor="middle">청킹 · 임베딩 · 두 컬렉션 적재</text><line x1="460" y1="428" x2="460" y2="452" stroke="#283c52" marker-end="url(#a)"/><rect x="150" y="452" width="620" height="58" rx="17" fill="white" stroke="#283c52"/><text x="460" y="487" text-anchor="middle">retrieve · 메타데이터 + similarity/MMR Top-k</text><line x1="460" y1="516" x2="460" y2="540" stroke="#283c52" marker-end="url(#a)"/><rect x="150" y="540" width="620" height="58" rx="17" fill="white" stroke="#283c52"/><text x="460" y="575" text-anchor="middle">generate · P3 답변 생성 · 인용 번호 검증</text><line x1="460" y1="604" x2="460" y2="628" stroke="#283c52" marker-end="url(#a)"/><rect x="150" y="628" width="620" height="58" rx="17" fill="white" stroke="#283c52"/><text x="460" y="663" text-anchor="middle">답변 · 출처 종류 · 기준일 · 이용 조건 표시</text><line x1="460" y1="686" x2="460" y2="725" stroke="#283c52" marker-end="url(#a)"/><circle cx="460" cy="740" r="12" fill="white" stroke="#182532"/><circle cx="460" cy="740" r="8" fill="#182532"/><text x="40" y="775" font-size="12">검증된 자체 문서만 외부 확장 · 캐시 적중 시 수집 생략 · 미지원/실패 시 준비된 근거 사용</text></g></svg>